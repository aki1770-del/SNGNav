# CI — SNGNav Snow Scene
#
# Runs on every push and pull request:
#   1. flutter analyze (zero issues required)
#   2. flutter test    (all tests must pass)
#   3. aggregate coverage summary (quality signal for edge developers)
#   4. flutter build linux --release (build must succeed)
#   5. hosted-resolve  (reproduce `pub add <pkg>` for a CLEAN consumer — the only lane that
#                       resolves each override-bearing package's DECLARED hosted sibling
#                       constraints against pub.dev instead of the monorepo `path:` overrides)
#
# Probe tests (tagged 'probe') are excluded — they require
# live network access to external APIs.

name: CI

on:
  # ⚑ push: ALL branches, deliberately. This was `branches: [main]`, and on
  # 2026-08-28 the turn-close gate measured the consequence: eleven packages had
  # been published that day from two branches CI had never run on --
  # `fix/latlong2-widen-0.10` (10 packages) and `backport/routing_engine-0.5.x`
  # (routing_engine 0.5.3). No pipeline claimed either ref.
  #
  # Merging to main does not fix this in general. `backport/**` is a maintenance
  # line that by design never merges to main, so a main-only trigger can NEVER
  # cover the branch we cut in-range patches from -- the ones that reach a
  # consumer who cannot take a major bump. The branch we are most careful about
  # was the branch with no gate at all.
  #
  # We publish from feature and backport branches. Anything we publish from must
  # be covered.
  push:
  pull_request:
    branches: [main]
  # ⚑ Added 2026-08-28: without this there was NO way to run CI on an existing
  # ref. Two branches were found carrying published packages and no pipeline
  # run, and nothing could be done about it except push again -- which rewrites
  # nothing and proves nothing about the ref that actually shipped.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: |
          flutter pub get
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get)
          done

      - name: Analyze
        run: dart analyze lib test

      - name: Live-source guard
        run: bash scripts/live_source_guard.sh

      - name: Sibling-constraint check — prove the instrument first
        # The guard shipped npm caret semantics 2026-08-21..08-28 and reported 8
        # false FAILs in 16. A gate that over-reports gets routed around
        # (Sakichi V20). The self-test is anchored to pub_semver and carries
        # negative controls that go RED if either defect is reintroduced, so the
        # instrument is proven on every push before its verdict is trusted.
        run: python3 scripts/sibling_constraint_check.py --self-test

      - name: Sibling-constraint check
        run: python3 scripts/sibling_constraint_check.py

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: |
          flutter pub get
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get)
          done

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libsqlite3-dev

      - name: Install coverage tooling
        run: dart pub global activate coverage

      - name: Run app tests with coverage
        run: flutter test --coverage --exclude-tags=probe

      - name: "GATE: pinned-live defect-proof suites"
        if: always()
        # These are the highest-value guards we own: each is the record that a defect
        # existed and the proof it cannot return. Until 2026-08-28 this step ended in
        # `|| true`, so a REGRESSION in them could not turn CI red -- while the package's
        # own dart_test.yaml said the job existed "so a future failure is unmissable".
        # It also hardcoded `for pkg in nav2_safety_layer`, the same allow-list defect
        # scripts/ci_package_tests.sh exists to kill, thirty lines away in this file.
        # The script enumerates instead of remembering, and GATES. A deleted guard is a
        # failure too: an absent verdict reads exactly like a pass.
        run: bash scripts/ci_pinned_live.sh

      - name: "REPORT (non-gating): stale-pin check"
        if: always()
        run: |
          # A repaired defect must not leave its warning standing. Reporting, NOT a gate —
          # it has a known false-positive mode on assert-the-defect-style tests, measured at
          # 4-in-5 on first run. See the header of scripts/stale-pin-check.py.
          python3 scripts/stale-pin-check.py packages/nav2_safety_layer || true

      - name: Run every package's test suite
        # if: always() -- added 2026-08-28. This step had no condition, so ANY earlier
        # app-test failure SKIPPED it and blinded us to all 37 package suites. On the
        # option-C branch that night, one failing app test hid whether the package
        # suite passed, and the comparison the Chair needed could not be made. It
        # still GATES -- its failure fails the job -- it just always MEASURES.
        if: always()
        # Was TWO hardcoded allow-lists -- 7 names for `dart test`, 5 for
        # `flutter test` -- covering 12 of 35 publishable packages. The other 23
        # had test/ directories that never once executed.
        #
        # This workflow already knew that failure mode, in its own words:
        #   "nav2_safety_layer ADDED 2026-08-21 ... this package's tests had
        #    NEVER run in CI -- it was in neither allow-list -- which is why four
        #    live defects and one STALE pin sat unreported since publication. A
        #    package whose tests never run is not passing; it is unmeasured."
        # The remedy applied then was to add ONE NAME. The list was the defect.
        #
        # Measured before this change, 2026-08-28: all 36 packages with a test/
        # directory pass. Enabling them costs runtime, not triage.
        run: ./scripts/ci_package_tests.sh

      - name: Merge coverage reports
        run: ./scripts/coverage_report.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/summary.txt

  build:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: |
          flutter pub get
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get)
          done

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libsqlite3-dev

      - name: Build release
        run: flutter build linux --release -t lib/snow_scene.dart

  test-target-dart:
    name: Test (embedded target Dart 3.10.1)
    # Process-fix C (D-VGC218-1, "freeze-neutral correctness-fix"): the embedded flutter-engine
    # (Yocto FLUTTER_SDK_TAG 3.38.3) ships Dart 3.10.1, but the other lanes pin 3.41.4 (Dart 3.12)
    # and silently hid every source requiring >3.10 — the skew that locked the embedded target out.
    # This lane resolves+analyzes+tests on the EXACT target Dart so that class can never return.
    # Resolves via the repo's local workspace (how the app is actually built); per-package
    # PUBLISHED-catalog consumability on 3.10 is the separate per-publish gate, not this lane.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'   # ships Dart 3.10.1 — the embedded IVI target

      - name: Assert target Dart is 3.10.x
        run: |
          dart --version
          dart --version 2>&1 | grep -q '3\.10\.' || { echo "::error::expected Dart 3.10.x"; exit 1; }

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libsqlite3-dev

      - name: Resolve on target Dart
        run: flutter pub get

      - name: Analyze app on target Dart
        run: dart analyze lib test

      - name: App tests on target Dart
        run: flutter test --exclude-tags=probe

  hosted-resolve:
    name: Hosted-resolve (pub add)
    # The resolution-masking lane. Six published packages ship monorepo-only
    # `dependency_overrides: path:` on their siblings (adaptive_reroute, driving_conditions,
    # driving_weather, navigation_safety, routing_bloc, voice_guidance). Every OTHER job above
    # runs `pub get` HONORING those overrides, so they only ever certify "works on this checkout."
    # This job reproduces what a CLEAN `pub add <pkg>` consumer gets: it strips the
    # `dependency_overrides:` block and resolves each package's DECLARED hosted sibling constraints
    # against pub.dev (NOT local path), then runs that package's own tests against the PUBLISHED
    # siblings. Red here = a published package would not resolve / would not pass for an edge
    # developer who `pub add`s it — the gap the analyze/test/build lanes cannot see.
    #
    # It invokes the SAME G7 gate as scripts/package_update_gate.sh (single source of truth for the
    # pre-publish gate AND CI, so the two can never drift). G7 SKIPs (does NOT go red) when pub.dev
    # is unreachable or when a sibling version a constraint needs is not yet published but the local
    # sibling satisfies it (a coordinated multi-package release in flight) — so this lane never
    # blocks offline and never false-reds a staged release.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # one package's failure must not hide the others'
      matrix:
        package:
          - adaptive_reroute
          - driving_conditions
          - driving_weather
          - navigation_safety
          - routing_bloc
          - voice_guidance
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Install Linux deps (flutter widget tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libsqlite3-dev

      - name: Reproduce `pub add ${{ matrix.package }}` for a clean consumer
        # Strips dependency_overrides, resolves the declared hosted siblings from pub.dev, and runs
        # the package's tests against them (G7). PKG_ROOT points the gate at this checkout's
        # packages/ (the script's default is an absolute developer path).
        run: PKG_ROOT="$GITHUB_WORKSPACE/packages" bash scripts/package_update_gate.sh --g7 ${{ matrix.package }}
