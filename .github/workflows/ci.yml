# CI — SNGNav Snow Scene
#
# Runs on every push and pull request:
#   1. flutter analyze (zero issues required)
#   2. flutter test    (all tests must pass)
#   3. aggregate coverage summary (quality signal for edge developers)
#   4. flutter build linux --release (build must succeed)
#   5. hosted-resolve  (reproduce `pub add <pkg>` for a CLEAN consumer — the only lane that
#                       resolves each override-bearing package's DECLARED hosted sibling
#                       constraints against pub.dev instead of the monorepo `path:` overrides)
#
# Probe tests (tagged 'probe') are excluded — they require
# live network access to external APIs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate-self-test:
    name: Gate self-test (does the gate's own wiring hold?)
    # The gate that guards every publish had a --self-test and NOTHING RAN IT.
    # Measured 2026-07-31: `--self-test` appeared in this file exactly once, in a
    # COMMENT (the hosted-resolve note below); the only invocation of the script
    # anywhere in CI was `--g7`. So the one guard standing between a silently
    # broken gate and a green publish was invitation-only — it fired when someone
    # remembered, which is the failure mode a loom exists to replace. A rule that
    # is written and even habitual still does not fire unless something MAKES it.
    #
    # It is a separate job, first, and needs no SDK: the assertions are offline by
    # construction (stub census, stub curl, a throwaway package tree), so this
    # lane can never go dark because the network did.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: scripts/package_update_gate.sh --self-test
        run: bash scripts/package_update_gate.sh --self-test

  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: |
          flutter pub get
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get)
          done

      - name: Analyze (root app + EVERY discovered package, lib + test)
        # Was: `dart analyze lib test` — the ROOT ONLY. Root is not a pub workspace, so
        # this analyzed 0 of 36 packages. test_all.sh --analyze-only analyzes all of them.
        run: ./scripts/test_all.sh --analyze-only

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: |
          flutter pub get
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get)
          done

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libsqlite3-dev

      - name: Install coverage tooling
        run: dart pub global activate coverage

      # ── LOOM A ───────────────────────────────────────────────────────────────
      # This ONE step replaces the three by-name loops that used to live here
      # (root app + 7 named dart packages + 5 named flutter packages = 12 of 36).
      # 23 packages with test/ suites — including navigation_safety_core's 309 tests,
      # compound_failure_advisor, every condition_aggregator adapter, and
      # pretrip_decision_advisor — were NEVER EXECUTED. They all passed. Nobody knew,
      # because nobody ran them. A by-name list can only test what someone remembered
      # to write down.
      #
      # test_all.sh DISCOVERS the package set from the filesystem, runs every suite,
      # and then GUARDS: it re-scans packages/*/test/ INDEPENDENTLY of discovery and
      # HALTS if any package with tests went unexecuted. That guard — not the running
      # of tests — is the loom. It is the step that makes the machine able to detect
      # its own blind spot.
      - name: Run EVERY discovered suite + GUARD against skipped packages
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          ./scripts/test_all.sh --test-only --coverage --concurrency=1

      - name: Merge coverage reports
        run: ./scripts/coverage_report.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/summary.txt

  build:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Resolve dependencies
        run: |
          flutter pub get
          for pkg in packages/*/; do
            (cd "$pkg" && flutter pub get)
          done

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libsqlite3-dev

      - name: Build release
        run: flutter build linux --release -t lib/snow_scene.dart

  test-target-dart:
    name: Test (embedded target Dart 3.10.1)
    # Process-fix C (D-VGC218-1, "freeze-neutral correctness-fix"): the embedded flutter-engine
    # (Yocto FLUTTER_SDK_TAG 3.38.3) ships Dart 3.10.1, but the other lanes pin 3.41.4 (Dart 3.12)
    # and silently hid every source requiring >3.10 — the skew that locked the embedded target out.
    # This lane resolves+analyzes+tests on the EXACT target Dart so that class can never return.
    # Resolves via the repo's local workspace (how the app is actually built); per-package
    # PUBLISHED-catalog consumability on 3.10 is the separate per-publish gate, not this lane.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'   # ships Dart 3.10.1 — the embedded IVI target

      - name: Assert target Dart is 3.10.x
        run: |
          dart --version
          dart --version 2>&1 | grep -q '3\.10\.' || { echo "::error::expected Dart 3.10.x"; exit 1; }

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libsqlite3-dev

      - name: Resolve on target Dart
        run: flutter pub get

      - name: Analyze app on target Dart
        run: dart analyze lib test

      - name: App tests on target Dart
        run: flutter test --exclude-tags=probe

  discover-overrides:
    # LOOM A, third list. hosted-resolve used to carry a BY-NAME matrix of SIX packages.
    # TEN packages actually ship `dependency_overrides: path:`. The four that were never
    # hosted-resolve-checked — pretrip_decision_advisor, route_condition_forecast,
    # snow_rendering, vehicle_condition_fusion — meant the lane built to catch resolution
    # blind spots HAD a resolution blind spot. The matrix is now derived from the pubspecs.
    name: Discover override-bearing packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: |
          PKGS="$(./scripts/discover_packages.sh --overrides --json)"
          echo "discovered override-bearing packages: $PKGS"
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"

  hosted-resolve:
    needs: [discover-overrides]
    name: Hosted-resolve (pub add)
    # The resolution-masking lane. Published packages that ship monorepo-only
    # `dependency_overrides: path:` on their siblings — DISCOVERED from the pubspecs by the
    # discover-overrides job above, never named here (naming them here is what let the set
    # drift to 6 while the disk said 10). Every OTHER job above runs `pub get` HONORING
    # those overrides, so they only ever certify "works on this checkout."
    # This job reproduces what a CLEAN `pub add <pkg>` consumer gets: it strips the
    # `dependency_overrides:` block and resolves each package's DECLARED hosted sibling constraints
    # against pub.dev (NOT local path), then runs that package's own tests against the PUBLISHED
    # siblings. Red here = a published package would not resolve / would not pass for an edge
    # developer who `pub add`s it — the gap the analyze/test/build lanes cannot see.
    #
    # It invokes the SAME G7 gate as scripts/package_update_gate.sh (single source of truth for the
    # pre-publish gate AND CI, so the two can never drift). G7 SKIPs (does NOT go red) when pub.dev
    # is unreachable or when a sibling version a constraint needs is not yet published but the local
    # sibling satisfies it (a coordinated multi-package release in flight) — so this lane never
    # blocks offline and never false-reds a staged release.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # one package's failure must not hide the others'
      matrix:
        # DISCOVERED, not enumerated — see the discover-overrides job above.
        package: ${{ fromJSON(needs.discover-overrides.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'

      - name: Install Linux deps (flutter widget tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libsqlite3-dev

      - name: Reproduce `pub add ${{ matrix.package }}` for a clean consumer
        # Strips dependency_overrides, resolves the declared hosted siblings from pub.dev, and runs
        # the package's tests against them (G7). PKG_ROOT is passed EXPLICITLY here, but it is
        # no longer a correction: the gate's default already resolves to its own checkout's
        # packages/ (it derives from the script's location, and --self-test asserts the resolved
        # value behaviourally — in the `gate-self-test` job above, which actually RUNS it; until
        # 2026-07-31 this sentence was the only mention of --self-test in this file and no lane
        # invoked it). The old note here — "the script's default is an absolute developer path" —
        # described a defect that was fixed; it is kept explicit only so the workspace root is
        # visible in the run log.
        run: PKG_ROOT="$GITHUB_WORKSPACE/packages" bash scripts/package_update_gate.sh --g7 ${{ matrix.package }}
