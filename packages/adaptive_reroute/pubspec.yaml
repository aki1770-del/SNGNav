name: adaptive_reroute
description: >-
  Safety-driven route adaptation for winter driving. Evaluates route
  condition forecasts, decides when rerouting is justified, and generates
  detour waypoints to bypass hazard zones. Pure Dart, no Flutter dependency.
version: 0.2.2
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - navigation
  - safety
  - automotive
  - winter-driving
  - routing

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.0.7
  latlong2: ">=0.9.1 <0.11.0"
  # 0.5.0 is the Measured-or-Absent release: nullable measured fields +
  # tri-state SafetyVerdict. This package's honest-absence behaviour depends on
  # that type surface, so the floor is hard.
  driving_weather: ^0.5.0
  fleet_hazard: '>=0.5.0 <0.8.0'
  # This package's lib/ imports no routing_engine symbol (it only holds a
  # RouteResult transitively, inside RouteForecast) — verified by grep. The
  # 0.6.0 nullable-position break therefore cannot reach it, so the range spans
  # it deliberately rather than pinning consumers needlessly.
  routing_engine: '>=0.4.0 <0.7.0'
  route_condition_forecast: ^0.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1

# Local development: sibling path overrides live in pubspec_overrides.yaml,
# beside this file, never inline here. pub does not strip dependency_overrides
# from a published pubspec, so an inline `path: ../<sibling>` shipped and made
# `pub get` inside the published package fail ("path which doesn't exist") for
# anyone outside this repository. pub does not publish a package-root
# pubspec_overrides.yaml, and .pubignore lists it as well.
