name: condition_aggregator_jma
description: >-
  JMA (気象庁) adapter for the condition_aggregator interface. Maps the
  JMA windowless per-prefecture warning JSON to source-neutral Advisory
  typed events. Pure Dart.
version: 0.7.0

# Reads the windowless per-prefecture warning JSON
# (bosai/warning/data/r8/{areacode}.json since 0.7.0; the 0.2.0-0.6.0 path
# bosai/warning/data/warning/ was RETIRED by JMA's 2026-05-29 restructure and
# has served a document frozen at 2026-05-28 ever since — do not fetch it)
# (0.2.0 replaced the 0.1.x
# atom-feed path's scroll-off false-negative). Windowless is NOT live: this
# comment claimed "always reflects the current in-force warning state" until
# 0.6.0; measured 2026-08-16 and again 2026-08-23, the path is frozen in a
# late-May window. Liveness is judged from reportDatetime and surfaced
# in-band (0.5.0). 0.3.0 resolves a border point to ALL
# containing prefectures and returns the conservative union (over-warn;
# partial reads flagged). 0.4.0 widens the surfaced warning classes from
# snow-only to include the downpour / typhoon-wind / thunder / fog
# turmoil classes (kJmaWarningCodes). See README.md "Status" +
# CHANGELOG.md.

repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - aggregator
  - advisory
  - jma
  - winter-driving
  - meteorology

environment:
  sdk: ^3.10.0

dependencies:
  # >=0.0.10 because 0.7.0 implements AdvisoryFeedFreshnessReporting, which
  # that version introduced. Below it the interface does not exist.
  condition_aggregator: '>=0.0.10 <0.2.0'
  # http is used to fetch the per-prefecture warning JSON. Warning-JSON
  # parsing is via dart:convert (no dependency needed).
  http: ^1.0.0
  # xml parses the short-time tier's report XML (0.6.0). The warning-JSON
  # path does not use it. This is the canonical Dart XML parser and was
  # this package's own dependency through 0.1.x (commit 6b944c1) before
  # the 0.2.0 move to JSON; the short-time tier is XML-only at source, so
  # it returns for that path alone.
  xml: ^6.5.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
  # Virtual-time control for the concurrency/timeout robustness tests
  # (hung-sibling isolation + anti-sequentialization timing) without real
  # 30 s waits. Test-only; not part of the published runtime closure.
  fake_async: ^1.3.0
