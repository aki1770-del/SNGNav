name: condition_aggregator_jma
description: >-
  JMA (気象庁) adapter for the condition_aggregator interface. Maps the
  JMA windowless per-prefecture warning JSON to source-neutral Advisory
  typed events. Pure Dart.
version: 0.2.0

# 0.2.0 reads the windowless per-prefecture warning JSON
# (bosai/warning/data/warning/{areacode}.json), which always reflects
# the current in-force warning state — replacing the 0.1.x atom-feed
# path that had a window/scroll-off false-negative for still-active
# warnings. See README.md "Status" + CHANGELOG.md "0.2.0".

repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - aggregator
  - advisory
  - jma
  - winter-driving
  - meteorology

environment:
  sdk: ^3.10.0

dependencies:
  condition_aggregator: ^0.0.5
  # http is used to fetch the per-prefecture warning JSON. Parsing is
  # via dart:convert (no third-party XML/JSON dependency needed).
  http: ^1.0.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
