name: condition_aggregator_met_norway
description: >-
  MET Norway (Meteorologisk institutt) locationforecast adapter for the
  condition_aggregator interface. Maps Norwegian and Nordic-region
  weather forecasts to source-neutral Advisory events. Pure Dart.
version: 0.0.7
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - aggregator
  - advisory
  - met-norway
  - norway
  - winter-driving

environment:
  sdk: ^3.10.0

dependencies:
  navigation_safety_calibration: ^0.1.3
  condition_aggregator: '>=0.0.5 <0.2.0'
  http: ^1.3.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
