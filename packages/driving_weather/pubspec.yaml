name: driving_weather
description: >-
  Real-time weather monitoring with snow, ice, and visibility hazard
  detection. Open-Meteo integration (free, no API key). Pure Dart.
version: 0.4.2
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - weather
  - driving
  - navigation
  - safety
  - winter-driving

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.0.7
  http: ^1.3.0
  condition_aggregator: ^0.0.5
  condition_aggregator_digitraffic: ^0.0.5

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
  mocktail: ^1.0.4

dependency_overrides:
  condition_aggregator:
    path: ../condition_aggregator
  condition_aggregator_digitraffic:
    path: ../condition_aggregator_digitraffic
