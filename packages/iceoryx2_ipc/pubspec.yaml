name: iceoryx2_ipc
description: >-
  Zero-copy shared-memory transport for road-condition samples, classified by
  the same VSS-conformant rule the KUKSA path uses. Eclipse iceoryx2 on the
  publisher side, Dart on the subscriber side. Host Linux only.
version: 0.0.1
publish_to: none
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.3
  kuksa_dart_sdk: ^0.2.9

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0

# NO dependency_overrides. kuksa_dart_sdk is resolved from pub.dev, not from a
# sibling worktree: the local tree is 0.2.10 (unpublished) and an override would
# have compiled this package against an API no consumer can obtain. Verified
# 2026-09-12 that the PUBLISHED 0.2.9 tarball carries `RoadFriction` and exports
# it from the barrel at lib/kuksa_dart_sdk.dart:57.
