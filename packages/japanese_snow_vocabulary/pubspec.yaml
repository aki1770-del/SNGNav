name: japanese_snow_vocabulary
description: >-
  Pure Dart JP-domestic snow vocabulary primitive — six enum cases
  (アイスバーン / ブラックアイスバーン / 雪道 / 圧雪 / シャーベット
  / 凍結) with verbatim JAF authoritative-source safe-driving-response
  citations preserved per AAA Article 17 (β) verbatim-relay binding.
  Three of six entries fully populated at 0.1.0; the remaining three
  are null-deferred to 0.2.0 per the SNGNav honest-disclosure pattern.
  No Flutter dependency; consumable from CLI tools, server-side
  fixtures, and any other Pure Dart package doing JP-domestic
  winter-driving vocabulary work.
version: 0.1.0
homepage: https://github.com/aki1770-del/SNGNav
repository: https://github.com/aki1770-del/SNGNav
issue_tracker: https://github.com/aki1770-del/SNGNav/issues
topics:
  - navigation
  - safety
  - automotive
  - snow
  - japan

environment:
  sdk: ^3.11.0

dependencies: {}

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
