name: map_viewport_bloc
description: >-
  Declarative camera state machine (follow / free look / route
  overview) for navigation maps with six-layer composition.
version: 0.4.2
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - map
  - bloc
  - navigation
  - flutter
  - automotive

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  latlong2: ^0.9.1
  navigation_safety_core: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true