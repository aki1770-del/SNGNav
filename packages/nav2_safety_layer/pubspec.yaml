name: nav2_safety_layer
description: >-
  Pure-Dart bridge composing navigation_safety_core driver-cognition
  primitives over the ROS 2 Navigation Stack (nav2) Collision Monitor
  and Collision Detector state messages. No transport lock-in.
version: 0.1.0

# Default publish target = https://pub.dev (no `publish_to:` line).

repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - ros2
  - nav2
  - safety
  - winter-driving

environment:
  sdk: ^3.11.0

dependencies:
  equatable: ^2.0.7
  navigation_safety_core: ^0.10.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
