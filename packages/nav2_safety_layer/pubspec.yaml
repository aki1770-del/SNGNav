name: nav2_safety_layer
description: >-
  Pure-Dart bridge composing navigation_safety_core primitives over
  ROS 2 Navigation Stack (nav2) Collision Monitor / Detector state
  messages.
version: 0.1.3

# Default publish target = https://pub.dev (no `publish_to:` line).

repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - ros2
  - nav2
  - safety
  - winter-driving

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.0.7
  navigation_safety_core: ">=0.10.0 <0.12.0"

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
