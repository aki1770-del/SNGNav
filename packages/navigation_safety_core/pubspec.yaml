name: navigation_safety_core
description: >-
  Pure Dart core models for navigation safety — alert severity,
  safety score, threshold config, navigation route, safety scenarios.
  No Flutter dependency.
version: 0.11.0
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - navigation
  - safety
  - automotive
  - winter-driving

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.0.7
  latlong2: ^0.9.1
  # Single source of truth for the meteorological/kinematic safety
  # baseline (re-exported from the barrel). Caution-add-only: the
  # per-profile floor never lowers across releases. Integrators should
  # commit pubspec.lock to pin the exact calibration version.
  navigation_safety_calibration: ^0.1.2

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
