name: noaa_nws_adapter
description: >-
  NOAA / NWS direct-consume wrapper — smallest-slice GeoJSON client
  for api.weather.gov active winter alerts by point. Pure Dart.
version: 0.0.4

# Default publish target = https://pub.dev (no `publish_to:` line).

repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - weather
  - noaa
  - nws
  - winter-driving
  - alerts

environment:
  sdk: '>=3.11.0-0 <4.0.0'

dependencies:
  equatable: ^2.0.7
  http: ^1.3.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
