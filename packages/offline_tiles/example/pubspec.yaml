name: offline_tiles_example
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  offline_tiles:
    path: ../
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Local-path overrides so the example resolves the 3.10-floored sibling SOURCES
# (not the stale ^3.11.0-published artifacts) on the embedded target Dart 3.10.1.
dependency_overrides:
  adaptive_reroute:
    path: ../../adaptive_reroute
  condition_aggregator:
    path: ../../condition_aggregator
  condition_aggregator_digitraffic:
    path: ../../condition_aggregator_digitraffic
  condition_aggregator_jma:
    path: ../../condition_aggregator_jma
  condition_aggregator_met_norway:
    path: ../../condition_aggregator_met_norway
  condition_aggregator_nws:
    path: ../../condition_aggregator_nws
  condition_aggregator_owm_road_risk:
    path: ../../condition_aggregator_owm_road_risk
  driving_conditions:
    path: ../../driving_conditions
  driving_consent:
    path: ../../driving_consent
  driving_weather:
    path: ../../driving_weather
  fleet_hazard:
    path: ../../fleet_hazard
  japanese_snow_vocabulary:
    path: ../../japanese_snow_vocabulary
  kalman_dr:
    path: ../../kalman_dr
  map_viewport_bloc:
    path: ../../map_viewport_bloc
  nav2_safety_layer:
    path: ../../nav2_safety_layer
  navigation_lend_mode_experiment:
    path: ../../navigation_lend_mode_experiment
  navigation_safety:
    path: ../../navigation_safety
  navigation_safety_calibration:
    path: ../../navigation_safety_calibration
  navigation_safety_core:
    path: ../../navigation_safety_core
  navigation_safety_enums:
    path: ../../navigation_safety_enums
  noaa_nws_adapter:
    path: ../../noaa_nws_adapter
  pretrip_decision_advisor:
    path: ../../pretrip_decision_advisor
  rosbridge_dart_client:
    path: ../../rosbridge_dart_client
  route_condition_forecast:
    path: ../../route_condition_forecast
  routing_bloc:
    path: ../../routing_bloc
  routing_engine:
    path: ../../routing_engine
  snow_rendering:
    path: ../../snow_rendering
  voice_guidance:
    path: ../../voice_guidance
