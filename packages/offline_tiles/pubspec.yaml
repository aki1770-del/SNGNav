name: offline_tiles
description: >-
  MBTiles-backed offline tile management for flutter_map. Pre-cache
  routes / regions; resolve tiles locally when offline.
version: 0.5.3
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - offline
  - mbtiles
  - flutter-map
  - navigation
  - automotive

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  mbtiles: ^0.5.0
  navigation_safety_core: ^0.10.0
  path_provider: ^2.1.5
  sqlite3: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
