name: pretrip_decision_advisor
description: >-
  Pure Dart pre-trip departure-timing decision advisor contract for
  snow-zone navigation. Defines abstract PretripAdvisor +
  PretripRecommendation DTO + CommuteShape + weather forecast inputs +
  decoupled DriverProfileSpec. Interface-only at 0.1.0; reference
  implementations compose with this contract. No Flutter dependency;
  consumable from CLI / server-side / any Pure Dart package.
version: 0.1.0
homepage: https://github.com/aki1770-del/SNGNav
repository: https://github.com/aki1770-del/SNGNav
issue_tracker: https://github.com/aki1770-del/SNGNav/issues
topics:
  - navigation
  - safety
  - automotive
  - driving
  - weather

environment:
  sdk: ^3.11.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
