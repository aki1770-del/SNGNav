name: pretrip_source_met_norway
description: >-
  MET Norway locationforecast hourly-forecast source for the
  pretrip_decision_advisor contract. Maps the global locationforecast
  compact product to a WeatherForecast measurement for the pre-trip
  "Before you drive" briefing. Pure Dart.
version: 0.2.3
license: BSD-3-Clause

repository: https://github.com/aki1770-del/SNGNav
issue_tracker: https://github.com/aki1770-del/SNGNav/issues
topics:
  - weather
  - forecast
  - navigation
  - safety
  - pretrip

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.3.0
  # Spans pretrip_decision_advisor 0.6.0 (HourHazard.unknown — a trip with NO
  # forecast no longer reports its peak hazard as `clear`). This package's lib/
  # reads neither HourHazard nor areaMeasuredVisibility, so 0.6.0 is
  # source-compatible. The widen is not cosmetic: for a 0.x package a caret does
  # not admit the next minor, so without it ^0.5.0 and 0.6.0 have an EMPTY
  # intersection and a consumer could not resolve this package against the fixed
  # advisor at all.
  pretrip_decision_advisor: '>=0.5.0 <0.7.0'

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
