name: routing_bloc_example
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  routing_bloc:
    path: ../
  navigation_safety: ^0.9.0
  # The example targets the PUBLISHED routing_engine line (0.5.x today),
  # where RouteManeuver.position is non-nullable; 0.5.1 skips maneuvers whose
  # location cannot be parsed. The 0.6.x line (nullable position) is not yet
  # on pub.dev, so pinning to it would make this example unresolvable. An
  # example app may pin narrower than the package (which spans <0.7.0).
  routing_engine: '>=0.4.0 <0.6.0'
  flutter_bloc: ^9.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

# Monorepo development: resolve sibling package locally; published
# releases resolve against pub.dev via the caret constraint above.
flutter:
  uses-material-design: true

# Local-path overrides for monorepo development live in pubspec_overrides.yaml
# (not published) so the example resolves the 3.10-floored sibling SOURCES
# (not the stale ^3.11.0-published artifacts) on the embedded target Dart 3.10.1.
