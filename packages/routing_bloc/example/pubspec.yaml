name: routing_bloc_example
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  routing_bloc:
    path: ../
  navigation_safety: ^0.9.0
  routing_engine: '>=0.4.0 <0.7.0'
  flutter_bloc: ^9.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

# Monorepo development: resolve sibling package locally; published
# releases resolve against pub.dev via the caret constraint above.
flutter:
  uses-material-design: true
