name: routing_bloc
description: >-
  Route lifecycle state machine (idle / loading / active / error) with
  glanceable progress UI. Works with any routing_engine backend.
version: 0.4.1
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - routing
  - bloc
  - navigation
  - flutter
  - automotive

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  latlong2: ^0.9.1
  navigation_safety: ^0.9.0
  routing_engine: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

# Monorepo development: use local path for sibling packages. Published
# releases resolve against pub.dev via the caret constraint above.
dependency_overrides:
  navigation_safety:
    path: ../navigation_safety
  navigation_safety_core:
    path: ../navigation_safety_core

flutter:
  uses-material-design: true