name: routing_bloc
description: >-
  Route lifecycle state machine (idle / loading / active / error) with
  glanceable progress UI. Works with any routing_engine backend.
version: 0.4.8
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - routing
  - bloc
  - navigation
  - flutter
  - automotive

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  latlong2: ">=0.9.1 <0.11.0"
  navigation_safety: ^0.9.0
  # Spans routing_engine 0.6.0 (RouteManeuver.position became nullable — the
  # Null Island fix). This package's lib/ reads no maneuver position, so 0.6.0
  # is source-compatible; the widen exists because a 0.x MINOR bump is a hard
  # stop for consumers, and without it route_condition_forecast 0.2.0 (which
  # pins >=0.6.0) and this package could not resolve together at all.
  routing_engine: '>=0.4.0 <0.7.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

# Local development: sibling path overrides live in pubspec_overrides.yaml,
# beside this file, never inline here. pub does not strip dependency_overrides
# from a published pubspec, so an inline `path: ../<sibling>` shipped and made
# `pub get` inside the published package fail ("path which doesn't exist") for
# anyone outside this repository. pub does not publish a package-root
# pubspec_overrides.yaml, and .pubignore lists it as well.

flutter:
  uses-material-design: true