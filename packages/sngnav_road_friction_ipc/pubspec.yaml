name: sngnav_road_friction_ipc
description: >-
  Host Linux x86_64 only. Receives road-friction samples over Eclipse iceoryx™
  (iceoryx2™) shared memory and classifies them with the RoadFriction rule
  from kuksa_dart_sdk.
version: 0.0.1
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues

platforms:
  linux:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.3
  kuksa_dart_sdk: ^0.2.9

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0

# NO dependency_overrides. kuksa_dart_sdk is resolved from pub.dev, not from a
# sibling worktree, so this package compiles against an API every consumer can
# obtain. `^0.2.9` resolves to 0.2.10 today (published 2026-09-12T13:31Z).
# `lib/src/client/road_friction.dart`, which carries `RoadFriction`, is
# byte-identical in the published 0.2.9 and 0.2.10 archives (sha256 28fbe0d5…,
# measured 2026-10-06), and both export it from the barrel
# (lib/kuksa_dart_sdk.dart:57 in 0.2.9, :64 in 0.2.10).
