name: snow_rendering
description: >-
  Weather-to-rendering computation for driving safety apps — surface
  classification, particle parameters, visibility degradation. Pure
  Dart.
version: 0.3.4
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - driving
  - safety
  - weather
  - navigation
  - winter-driving

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.0.7
  driving_weather: ^0.5.0
  navigation_safety_core: '>=0.10.0 <0.12.0'
  # The family's single source of truth for the radiative-frost black-ice
  # classification (depend on it, never copy it) — so the
  # in-drive surface classifier and the pre-trip advisor cannot drift.
  navigation_safety_calibration: ^0.1.3
  # Precise JP-domestic surface vocabulary (JAF-authoritative) so the
  # in-drive announcement can name the surface a Japanese driver knows by name —
  # ブラックアイスバーン, not a generic English "black ice risk".
  japanese_snow_vocabulary: ^0.2.3

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1

# Local development: sibling path overrides live in pubspec_overrides.yaml,
# beside this file, never inline here. pub does not strip dependency_overrides
# from a published pubspec, so an inline `path: ../<sibling>` shipped and made
# `pub get` inside the published package fail ("path which doesn't exist") for
# anyone outside this repository. pub does not publish a package-root
# pubspec_overrides.yaml, and .pubignore lists it as well.
