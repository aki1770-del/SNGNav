name: vehicle_condition_fusion_example
description: >-
  Runnable, laptop-only demo for vehicle_condition_fusion: replays an
  ILLUSTRATIVE SYNTHETIC Akita-whiteout signal trace through the published
  fusion and prints the evolving hazard assessment. No databroker, no vehicle.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  # Direct: the demo re-derives the FRESH candidate assessment (to mark
  # debounce-held steps) via DrivingConditionAssessment.fromCondition, and
  # reads RoadSurfaceState for the printed verdict.
  #
  # This range is EXACTLY the parent's own range (../pubspec.yaml). An example
  # must never be narrower than the package it demonstrates: a reader whose app
  # already resolves driving_conditions 0.7.x is entitled to run this example,
  # because vehicle_condition_fusion 0.5.0 itself accepts 0.7.x. It was ^0.6.0
  # — i.e. >=0.6.0 <0.7.0 — which excluded the BREAKING 0.7.0 (fleet term
  # removed from the safety score) and 0.7.1, both of which the parent accepts.
  #
  # Verified 2026-09-12 at BOTH ends of this range against the published
  # archive: 0.6.0 and 0.7.1, `dart analyze` clean and `dart run main.dart`
  # exit 0 on each.
  driving_conditions: ">=0.6.0 <0.8.0"
  vehicle_condition_fusion:
    path: ../

# Monorepo development: the sibling path overrides live in
# `pubspec_overrides.yaml`, NOT here, and that file is excluded from the
# published archive by `../.pubignore`.
#
# WHY, measured 2026-09-12: pub does NOT strip `dependency_overrides` from a
# published archive. The overrides that used to sit in this file SHIPPED inside
# vehicle_condition_fusion 0.5.0 pointing at `../../driving_conditions` and
# three more siblings — paths that do not exist for anyone who is not standing
# in this monorepo. A reader who extracted the archive and ran `dart pub get`
# in example/ got exit 66, "path which doesn't exist", and never reached the
# version constraint above at all. The example did not run for them.

dev_dependencies:
  test: ^1.25.0
  # The KUKSA databroker bridge example (example/kuksa_databroker.dart) imports
  # the real SDK so the live `client.subscribe(...)` path is COMPILE-CHECKED
  # against the actual SDK types. It is a dev_dependency of the EXAMPLE only —
  # the published `vehicle_condition_fusion` package stays completely SDK-free
  # (see ../pubspec.yaml). The default `dart run` uses a fake source and never
  # dials a broker; only `--live host:port` constructs a real KuksaClient.
  kuksa_dart_sdk: ^0.2.3
