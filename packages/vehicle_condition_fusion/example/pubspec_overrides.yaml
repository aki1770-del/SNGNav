# Monorepo development ONLY — never published.
#
# Resolves the sibling packages from the working tree so a change to
# driving_conditions / driving_weather / snow_rendering /
# navigation_safety_calibration is exercised by this example before it is
# released. Excluded from the published archive by ../.pubignore.
#
# This lives in its own file, not in pubspec.yaml, because pub does NOT strip
# dependency_overrides when publishing: in vehicle_condition_fusion 0.5.0 these
# four path overrides shipped to pub.dev and made the example unresolvable
# (exit 66) for every consumer.
dependency_overrides:
  # Same closure as ../pubspec_overrides.yaml: the path-resolved
  # driving_conditions 0.7.4 needs navigation_safety_core >=0.11.10, which is
  # not on pub.dev yet. `flutter pub get` in the parent also resolves this
  # example, so omitting it fails the parent's resolve too.
  navigation_safety_core:
    path: ../../navigation_safety_core
  driving_weather:
    path: ../../driving_weather
  driving_conditions:
    path: ../../driving_conditions
  snow_rendering:
    path: ../../snow_rendering
  navigation_safety_calibration:
    path: ../../navigation_safety_calibration
