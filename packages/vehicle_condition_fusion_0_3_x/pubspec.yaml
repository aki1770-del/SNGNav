name: vehicle_condition_fusion
description: >-
  Safety-calibrated fusion of in-vehicle signals (road friction, TCS/ABS,
  wiper/rain, ambient temperature) into a driving-condition hazard verdict,
  with an honest-degradation rail. Pure Dart, no Flutter, no databroker SDK.
version: 0.3.4
homepage: https://github.com/aki1770-del/SNGNav
repository: https://github.com/aki1770-del/SNGNav
issue_tracker: https://github.com/aki1770-del/SNGNav/issues
topics:
  - driving
  - safety
  - automotive
  - navigation
  - winter-driving

environment:
  sdk: ^3.10.0

dependencies:
  driving_conditions: ^0.5.2
  driving_weather: ^0.4.2
  equatable: ^2.0.7

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1
