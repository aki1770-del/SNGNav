name: voice_guidance_example
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  voice_guidance:
    path: ../
  navigation_safety: ^0.9.0
  routing_engine: '>=0.4.0 <0.7.0'
  latlong2: ^0.9.1
  flutter_bloc: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Monorepo development: the sibling path overrides live in
# `pubspec_overrides.yaml`, NOT here, and that file is excluded from the
# published archive by `../.pubignore`. pub does NOT strip
# `dependency_overrides` from a published archive; inline, they made this
# example unresolvable for anyone outside this monorepo (`dart pub get`
# exit 66, "path which doesn't exist").
