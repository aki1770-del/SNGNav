name: voice_guidance_example
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  voice_guidance:
    path: ../
  # Sibling constraints must INTERSECT voice_guidance's own, or the example
  # cannot resolve at all. voice_guidance 0.7.x requires
  # navigation_safety ^0.9.0 and routing_engine '>=0.4.0 <0.6.0'.
  navigation_safety: ^0.9.0
  routing_engine: '>=0.4.0 <0.6.0'
  latlong2: ^0.9.1
  flutter_bloc: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
