name: voice_guidance
description: >-
  Platform-agnostic voice guidance for navigation apps. Works on
  mobile (flutter_tts), Linux (spd-say), and silently in CI.
version: 0.7.3
repository: https://github.com/aki1770-del/sngnav
issue_tracker: https://github.com/aki1770-del/sngnav/issues
topics:
  - tts
  - voice
  - navigation
  - accessibility
  - flutter

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  flutter_tts: ^4.2.2
  flutter_bloc: ^9.1.0
  navigation_safety: ^0.9.0
  navigation_safety_core: '>=0.10.0 <0.12.0'
  navigation_safety_enums: ^0.1.3
  # Spans routing_engine 0.6.0 (RouteManeuver.position became nullable — the
  # Null Island fix). This package's lib/ reads no maneuver position, so 0.6.0
  # is source-compatible; the widen exists because a 0.x MINOR bump is a hard
  # stop for consumers, and without it route_condition_forecast 0.2.0 (which
  # pins >=0.6.0) and this package could not resolve together at all.
  routing_engine: '>=0.4.0 <0.7.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  latlong2: ^0.9.1

# Monorepo development: use local path for sibling packages. Published
# releases resolve against pub.dev via the caret constraint above.
dependency_overrides:
  navigation_safety:
    path: ../navigation_safety
  navigation_safety_core:
    path: ../navigation_safety_core
  navigation_safety_enums:
    path: ../navigation_safety_enums

flutter:
  uses-material-design: true
