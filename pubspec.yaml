name: sngnav_snow_scene
description: >
  Offline-first Flutter navigation with dead reckoning, weather safety,
  and configurable providers.
publish_to: 'none'
version: 0.4.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  kalman_dr:
    path: packages/kalman_dr
  driving_weather:
    path: packages/driving_weather
  driving_consent:
    path: packages/driving_consent
  routing_engine:
    path: packages/routing_engine
  routing_bloc:
    ^0.2.0
  offline_tiles:
    ^0.4.0
  fleet_hazard:
    path: packages/fleet_hazard
  navigation_safety:
    ^0.2.0
  map_viewport_bloc:
    ^0.2.0
  driving_conditions:
    path: packages/driving_conditions
  snow_rendering:
    ^0.1.0
  route_condition_forecast:
    path: packages/route_condition_forecast
  adaptive_reroute:
    path: packages/adaptive_reroute
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dbus: ^0.7.10
  http: ^1.3.0
  sqlite3: ^3.2.0
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

dependency_overrides:
  routing_engine:
    path: packages/routing_engine
  driving_weather:
    path: packages/driving_weather
  driving_conditions:
    path: packages/driving_conditions
  driving_consent:
    path: packages/driving_consent
  fleet_hazard:
    path: packages/fleet_hazard
  navigation_safety:
    path: packages/navigation_safety
  navigation_safety_core:
    path: packages/navigation_safety_core
  map_viewport_bloc:
    path: packages/map_viewport_bloc
  routing_bloc:
    path: packages/routing_bloc
  offline_tiles:
    path: packages/offline_tiles
  snow_rendering:
    path: packages/snow_rendering
  kalman_dr:
    path: packages/kalman_dr
  route_condition_forecast:
    path: packages/route_condition_forecast
  adaptive_reroute:
    path: packages/adaptive_reroute

# Embedded ARM IVI Blocker 2 closure — BDE-CANDIDATE-1 SHAPE A-PRIME component 2 (2026-05-23).
# sqlite3 ^3.2.0 uses Dart code-asset hooks; on the embedded ARM IVI target the
# sqlite3 native side is provided by oe-core's libsqlite3-0 (build-verified for
# cortexa15t2hf armv7 against scarthgap sysroot; 5 CVE patches applied). Declare
# source=system so the Dart hook resolves to the rootfs library, not a vendored
# build. Serves drivers in unexpected snow + their families by closing the asset-
# resolution path between SNGNav's AOT libapp.so and the verified system libsqlite3.
# Defense-in-depth pairing with the YRA recipe RDEPENDS; harmless on desktop targets
# where dependency_overrides + standard pub-get continue to govern.
hooks:
  user_defines:
    sqlite3:
      source: system
      name_linux: sqlite3

flutter:
  uses-material-design: true
